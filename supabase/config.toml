# Edge functions del nuevo Pasify (post-refactor)
# `verify_jwt = false` solo para webhooks (Stripe firma), magic links públicos
# y endpoints públicos de salud/captcha. El resto valida JWT en el código
# mediante supabaseAdmin.auth.getUser(token).

# -------- Stripe webhooks (firma Stripe, no JWT) --------
[functions.stripe-webhook]
verify_jwt = false

# -------- Public endpoints (no JWT) --------
[functions.health-check]
verify_jwt = false

[functions.verify-captcha]
verify_jwt = false

# -------- Magic links (token propio) --------
[functions.accept-ticket-transfer]
verify_jwt = false

[functions.accept-team-invitation]
verify_jwt = false

# -------- Authenticated edge functions (JWT requerido) --------
# El resto (40+) usa verify_jwt = true por defecto.
