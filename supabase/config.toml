# Edge functions de Pasify: una entrada por función desplegada.
#
# Todas llevan `verify_jwt = false`, igual que en producción: el workflow de
# despliegue (.github/workflows/deploy-production.yml) las publica con
# --no-verify-jwt porque la app usa la publishable key (sb_publishable_…), que
# no es un JWT, y el gateway rechazaría toda llamada sin sesión. Tenerlo
# también aquí hace que un `supabase functions deploy <nombre>` a mano deje la
# función igual que el CI, y que `supabase functions serve` se comporte como
# producción.
#
# La autorización la hace cada función en su código (supabase/functions/_shared):
# requireUser, requireAdmin / isPlatformAdmin o requireServiceRole; los
# webhooks comprueban la firma y los enlaces públicos su propio token. Una
# función nueva sin una de esas comprobaciones queda abierta: revísalo en el PR
# y añade aquí su entrada.
#
# Una función que se retira: se borra su carpeta y su entrada, y después
# `supabase functions delete <nombre>` en producción (el despliegue nunca borra).

# -------- Stripe (firma de Stripe, no JWT) --------
[functions.stripe-webhook]
verify_jwt = false

# Vuelta de Stripe Checkout. En la app nativa se paga en Safari, sin sesión:
# la función acepta session_id + order_id que casen con el pedido (o el JWT
# del comprador/admin) y limita por IP.
[functions.confirm-checkout-session]
verify_jwt = false

# -------- Públicas --------
[functions.health-check]
verify_jwt = false

[functions.verify-captcha]
verify_jwt = false

# -------- Enlaces con token propio (magic links) --------
[functions.accept-ticket-transfer]
verify_jwt = false

[functions.accept-team-invitation]
verify_jwt = false

# -------- Entradas públicas (?id=<ticket_id>&k=<access_url_token>) --------
# ticket-qr: PNG del QR (lo cargan los clientes de correo, sin cabeceras).
# ticket-public: datos de la página /#/entrada/:id.
[functions.ticket-qr]
verify_jwt = false

[functions.ticket-public]
verify_jwt = false

