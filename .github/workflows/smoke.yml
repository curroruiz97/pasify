name: Smoke · post-deploy

# Ejecuta smoke tests contra producción cuando Vercel confirma deployment.
# Tres niveles de verificación: HTTP routes (web SPA), Supabase health-check
# edge function, y seguridad básica: las funciones protegidas contestan 401 o
# 403 sin sesión (cualquier otra cosa, también un 404 o un 500, es un fallo).
#
# Los checks contra Supabase son condicionales: si las repo vars/secrets
# requeridas no están configuradas, los steps se SALTAN con un mensaje
# explícito en vez de fallar. Esto evita falsos positivos por configuración
# de repo incompleta cuando aún no se ha cableado SUPABASE_ANON_KEY o
# SUPABASE_PROJECT_REF_PRODUCTION.

on:
  deployment_status:
  # Permite disparo manual desde la UI de Actions
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL a probar (default: producción)"
        type: string
        required: false
        default: "https://pasifyy.vercel.app"

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Sólo cuando Vercel reporta success y es production (no preview)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    name: Smoke production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Mapeo job-level: GitHub Actions no permite `secrets.*` ni `vars.*` dentro
    # de `if:` expressions de step (parse-time), pero `env.*` sí. Si el secret
    # no está definido el valor es '' y los steps condicionales se saltan.
    env:
      SLACK_WEBHOOK_OPS: ${{ secrets.SLACK_WEBHOOK_OPS }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF_PRODUCTION }}
    steps:
      - name: Resolve target URL
        id: target
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            URL="${{ inputs.base_url }}"
          else
            URL="${{ github.event.deployment_status.target_url }}"
            if [[ -z "$URL" ]]; then
              URL="${{ github.event.deployment.payload.web_url }}"
            fi
          fi
          # Fallback al dominio canónico si el evento no aportó URL útil.
          # Algunos eventos deployment_status llegan sin target_url y rompían
          # el step 1 al hacer curl "".
          if [[ -z "$URL" || "$URL" == "https://" ]]; then
            URL="https://pasifyy.vercel.app"
            echo "ℹ Event-provided URL empty; falling back to $URL"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Target URL: $URL"

      - name: HTTP — homepage returns 200 + Pasify in HTML
        env:
          URL: ${{ steps.target.outputs.url }}
        run: |
          set -e
          echo "→ GET $URL"
          # Sin -f: examinamos status reales (incluso 4xx/5xx) en vez de
          # abortar curl. --max-time evita que un deploy en frío cuelgue 5 min.
          status=$(curl -sSL -o /tmp/page.html -w "%{http_code}" --max-time 30 "$URL")
          echo "  Status: $status"
          if [[ "$status" != "200" ]]; then
            echo "✗ Got status $status (expected 200)"
            echo "--- Body (first 500 bytes) ---"
            head -c 500 /tmp/page.html || true
            exit 1
          fi
          if ! grep -qi "pasify" /tmp/page.html; then
            echo "✗ HTML doesn't contain 'pasify' — branding/app regression"
            head -c 500 /tmp/page.html
            exit 1
          fi
          echo "✓ Homepage 200 + 'pasify' present in HTML"

      - name: Supabase health-check edge function
        if: env.SUPABASE_PROJECT_REF != '' && env.SUPABASE_ANON_KEY != ''
        run: |
          set -e
          URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/health-check"
          echo "→ GET $URL"
          resp=$(curl -sSL -w "\n%{http_code}" -H "apikey: $SUPABASE_ANON_KEY" --max-time 15 "$URL")
          status=$(echo "$resp" | tail -1)
          body=$(echo "$resp" | head -n -1)
          if [[ "$status" != "200" ]]; then
            echo "✗ health-check returned $status: $body"
            exit 1
          fi
          echo "✓ health-check OK: $body"

      - name: Skip Supabase checks (config missing)
        if: env.SUPABASE_PROJECT_REF == '' || env.SUPABASE_ANON_KEY == ''
        run: |
          echo "⊘ Supabase smoke checks skipped — falta configurar:"
          [[ -z "$SUPABASE_PROJECT_REF" ]] && echo "   · repo variable SUPABASE_PROJECT_REF_PRODUCTION (ej: ixkyfwzkknehvsqpopof)"
          [[ -z "$SUPABASE_ANON_KEY" ]] && echo "   · repo secret SUPABASE_ANON_KEY (anon key del proyecto producción)"
          echo "   Settings → Secrets and variables → Actions"

      - name: Security — funciones protegidas rechazan sin sesión (401/403)
        if: env.SUPABASE_PROJECT_REF != '' && env.SUPABASE_ANON_KEY != ''
        run: |
          set -uo pipefail
          # Todas se despliegan con --no-verify-jwt: quien rechaza es el código
          # de cada función (requireUser / requireAdmin / requireServiceRole),
          # que sin cabecera Authorization contesta 401. Se exige 401 o 403:
          #   200 → la función está abierta;
          #   400 → lee el cuerpo antes de comprobar quién llama;
          #   404 → no está desplegada (o se ha borrado sin quitarla de aquí);
          #   5xx → se cae antes de llegar a la comprobación.
          # Las hay de los tres tipos: solo admin, con sesión y solo servidor.
          fns=(
            admin-cancel-partner-subscription
            delete-user
            process-refund
            partner-cancel-event
            gdpr-export-data
            delete-own-account
            dispatch-notification
            send-push
            send-sms
            notify-admin-message
          )
          failed=0
          for fn in "${fns[@]}"; do
            url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/${fn}"
            status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Content-Type: application/json" \
              --data '{}' \
              --max-time 15 \
              "$url")
            if [[ "$status" == "401" || "$status" == "403" ]]; then
              echo "✓ $fn → $status"
            else
              echo "✗ $fn → $status (se esperaba 401 o 403)"
              failed=1
            fi
          done
          exit "$failed"

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_OPS != ''
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            { "text": "🚨 Pasify smoke FAILED on ${{ steps.target.outputs.url }} · commit ${{ github.sha }}" }
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_OPS }}
