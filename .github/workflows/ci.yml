name: CI · Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20 # El typecheck real tarda ~4 min (tipos generados de Supabase)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --prefer-offline --no-audit
      - name: Lint
        run: npm run lint
        continue-on-error: true # No bloquea hasta limpiar warnings legacy
      - name: TypeScript check (sin errores nuevos vs baseline)
        run: npm run typecheck # Falla con cualquier error que no este en scripts/typecheck-baseline.json
      - name: i18n encoding check (no mojibake)
        run: npm run i18n:check

  e2e-partner:
    name: E2E · panel de local (Supabase simulado)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --prefer-offline --no-audit
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      # Arranca su propio Vite en :8090 apuntando a un Supabase falso: no
      # necesita secretos ni toca ningún proyecto real.
      - name: Smoke del panel de local
        run: npm run test:e2e:partner
      - name: Trazas y capturas del fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-partner-test-results
          path: test-results/partner-shell/
          retention-days: 7

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm audit --production --audit-level=high
        continue-on-error: true
