name: CI · Quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Límite del chunk principal de la web: el script de entrada que carga
  # dist/index.html (dist/assets/index-*.js), en KB de 1024 bytes y sin
  # comprimir. Lo comprueba el paso «Tamaño del chunk principal». En la Ola 3
  # (sept. 2026) pesaba ~792 KB. Se sube solo a propósito, en el PR que lo
  # justifique.
  MAX_MAIN_CHUNK_KB: "850"

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 25 # El typecheck real tarda ~4 min (tipos generados de Supabase) y el build ~2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --prefer-offline --no-audit
      - name: Lint
        run: npm run lint
        continue-on-error: true # No bloquea hasta limpiar warnings legacy
      - name: TypeScript check (sin errores nuevos vs baseline)
        run: npm run typecheck # Falla con cualquier error que no este en scripts/typecheck-baseline.json
      - name: i18n encoding check (no mojibake)
        run: npm run i18n:check
      # El typecheck no ve lo que solo rompe al empaquetar (imports que Vite no
      # resuelve, JSON o assets que faltan, el guardia de variables de Supabase
      # de vite.config.ts). Usa los valores públicos de .env.production.
      - name: Build (vite build)
        run: npm run build
      # Toda visita descarga el chunk principal antes de pintar nada: esto para
      # un import estático pesado que se cuele en el arranque (una librería
      # entera, una pantalla sin lazy()). Hay otros index-*.js pequeños
      # (módulos que se llaman index): el principal es el que carga index.html.
      - name: Tamaño del chunk principal
        run: |
          set -euo pipefail
          main="$(grep -oE 'src="[^"]*assets/index-[^"]+\.js"' dist/index.html | head -n1 \
            | sed -E 's#^src="[^"]*(assets/[^"]+)"$#dist/\1#' || true)"
          if [[ -z "$main" || ! -f "$main" ]]; then
            main="$(ls -S dist/assets/index-*.js | head -n1)"
          fi
          bytes="$(stat -c %s "$main")"
          max=$(( MAX_MAIN_CHUNK_KB * 1024 ))
          kb="$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1024 }')"
          echo "Chunk principal: $main · ${kb} KB (límite ${MAX_MAIN_CHUNK_KB} KB)"
          echo "Chunk principal \`$(basename "$main")\`: **${kb} KB** de ${MAX_MAIN_CHUNK_KB} KB" >> "$GITHUB_STEP_SUMMARY"
          if (( bytes > max )); then
            echo "::error file=${main}::El chunk principal pesa ${kb} KB y el límite es ${MAX_MAIN_CHUNK_KB} KB (MAX_MAIN_CHUNK_KB en .github/workflows/ci.yml). Carga con import() lo que no haga falta al arrancar."
            exit 1
          fi

  e2e-partner:
    name: E2E · panel de local (Supabase simulado)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --prefer-offline --no-audit
      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium
      # Arranca su propio Vite en :8090 apuntando a un Supabase falso: no
      # necesita secretos ni toca ningún proyecto real.
      - name: Smoke del panel de local
        run: npm run test:e2e:partner
      - name: Trazas y capturas del fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-partner-test-results
          path: test-results/partner-shell/
          retention-days: 7

  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      # Historial completo: gitleaks revisa los commits del PR (base..head) y
      # con un clon superficial no los encuentra.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Bloquea el PR si encuentra un secreto o datos sensibles.
      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm audit --production --audit-level=high
        continue-on-error: true
