name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      function_name:
        description: "Deploy only this function (empty = all)"
        type: string
        required: false

concurrency:
  group: deploy-edge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF_PRODUCTION }}
      # --no-verify-jwt a propósito: la app usa la publishable key nueva
      # (sb_publishable_…), que no es un JWT, así que el gateway rechazaría
      # toda llamada sin sesión. La autorización la hace cada función en su
      # código: requireUser, requireAdmin o requireServiceRole de
      # supabase/functions/_shared. Una función nueva sin una de esas llamadas
      # queda abierta: revísalo en cada PR.
      - name: Deploy all functions
        if: github.event.inputs.function_name == ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          for fn in supabase/functions/*/; do
            name=$(basename "$fn")
            # Skip carpetas con prefijo `_` (compartidas, tests, legacy).
            # Supabase Preview Branching también honra esta convención.
            if [[ "$name" == _* ]]; then continue; fi
            echo "🚀 Deploying $name"
            supabase functions deploy "$name" --no-verify-jwt
          done
      - name: Deploy single function
        if: github.event.inputs.function_name != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy ${{ github.event.inputs.function_name }} --no-verify-jwt
      - name: Smoke test health-check
        run: |
          curl -fsS https://${{ vars.SUPABASE_PROJECT_REF_PRODUCTION }}.supabase.co/functions/v1/health-check \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" | jq . || echo "health-check no disponible aún"
        continue-on-error: true
