name: Deploy Edge Functions

on:
  push:
    branches: [main, staging]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      function_name:
        description: "Deploy only this function (empty = all)"
        type: string
        required: false

concurrency:
  group: deploy-edge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Determine project ref
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ref=${{ vars.SUPABASE_PROJECT_REF_PRODUCTION }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ vars.SUPABASE_PROJECT_REF_STAGING }}" >> $GITHUB_OUTPUT
          fi
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref ${{ steps.env.outputs.ref }}
      - name: Deploy all functions
        if: github.event.inputs.function_name == ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          for fn in supabase/functions/*/; do
            name=$(basename "$fn")
            if [[ "$name" == "_shared" || "$name" == "_tests" ]]; then continue; fi
            echo "🚀 Deploying $name"
            supabase functions deploy "$name" --no-verify-jwt
          done
      - name: Deploy single function
        if: github.event.inputs.function_name != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy ${{ github.event.inputs.function_name }}
      - name: Smoke test health-check
        run: |
          curl -fsS https://${{ steps.env.outputs.ref }}.supabase.co/functions/v1/health-check \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" | jq .
        continue-on-error: true
