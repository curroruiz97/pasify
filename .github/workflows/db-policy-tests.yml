name: DB · Policy tests (pgTAP-style)

# Tests RLS y SECURITY DEFINER de Pasify. Levanta una Supabase local con
# `supabase start` y ejecuta `tests/db/policies.sql` con psql.
#
# Por coste (~5 min cold start de supabase local), NO se ejecuta en cada PR
# por defecto — solo cuando el PR tiene la label `db-test` o en pushes a main
# que toquen migraciones.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "tests/db/**"
      - ".github/workflows/db-policy-tests.yml"
  pull_request:
    types: [labeled, synchronize]
    paths:
      - "supabase/migrations/**"
      - "tests/db/**"
      - ".github/workflows/db-policy-tests.yml"
  workflow_dispatch:

concurrency:
  group: db-policy-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-tests:
    # En PRs sólo correr si tiene label `db-test`. En push/dispatch, siempre.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'db-test'))
    name: Apply migrations + run policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Wait for DB ready
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 54322 -U postgres; then
              echo "✓ Supabase DB ready"
              exit 0
            fi
            sleep 2
          done
          echo "✗ Supabase DB not ready after 60s"
          exit 1

      - name: Apply migrations
        run: supabase db reset --local --no-seed

      - name: Run policy tests (psql)
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f tests/db/policies.sql 2>&1 | tee /tmp/policy.log
          # Count NOTICE lines that say PASS vs FAIL
          PASS=$(grep -c "PASS test" /tmp/policy.log || true)
          FAIL=$(grep -c "FAIL test" /tmp/policy.log || true)
          echo "════════════════════════════════════════════"
          echo "Policy tests: $PASS pass · $FAIL fail"
          echo "════════════════════════════════════════════"
          if [[ "$FAIL" -gt 0 ]]; then
            exit 1
          fi

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true
