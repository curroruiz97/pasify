apply plugin: 'com.android.application'

// ============================================================
// Signing properties · leídas desde android/keystore.properties
// (gitignored). Si el archivo NO existe, signingConfig.release no se
// poblará y el build de release fallará con un mensaje claro — esto es
// intencional: una APK release SIN firmar no debe distribuirse. Para
// crear el keystore y el archivo properties, ver el README.md sección
// "APK Android" o el plan en C:\Users\USUARIO\.claude\plans\.
// ============================================================
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "es.pasify.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "es.pasify.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // OJO: mantener esto sincronizado con lo que hay en Play Console.
        // La build rechazada del 15 ago 2026 se subio como versionCode 2 /
        // versionName 1.1, pero ese bump se hizo a mano y nunca se commiteo:
        // el repo se quedo en 1 y la correccion salio con un 2 duplicado que
        // Play no admite. De ahi el 3.
        // Antes de cada envio, comprueba el versionCode de la ultima version
        // en Play y sube desde ahi, no desde lo que ponga este fichero.
        versionCode 5
        versionName "1.1.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 activo: ofusca, elimina código muerto y reduce el APK
            // de ~22MB a ~9MB en builds típicos de Capacitor + React.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release

            // Símbolos de depuración nativos dentro del propio AAB. Sin esto
            // Play avisa en cada subida ("contiene código nativo pero no has
            // subido símbolos") y las trazas de fallos y ANR de las .so de
            // Sentry llegan a Android Vitals sin simbolizar, es decir,
            // ilegibles. Aplica a las librerías nativas, no al código Java.
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            // Debug build NO se firma con keystore producción.
            minifyEnabled false
            shrinkResources false
        }
    }

    // Si en algún momento aparece "More than one file was found with OS independent path"
    // descomenta el packagingOptions para excluir LICENSE duplicados.
    // packagingOptions {
    //     resources {
    //         excludes += ['META-INF/LICENSE.md', 'META-INF/LICENSE-notice.md']
    //     }
    // }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
