<body>
<!--
  Splash inline visibile prima del mount React.
  Pinned dark from the first paint, no white flash possible.
-->
<style>
  html, body { margin: 0; padding: 0; border: 0; background: #0a0a0a; }
  body { overflow-x: hidden; }
  #app-splash {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    width: 100vw; height: 100vh;
    z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #1a0e05 0%, #0a0a0a 70%);
    transition: opacity 280ms ease-out;
    margin: 0; padding: 0; border: 0; outline: 0;
    overflow: hidden;
  }
  #app-splash, #app-splash * { outline: 0 !important; border: 0 !important; }
  #app-splash.fade-out { opacity: 0; pointer-events: none; }
  #app-splash .wordmark {
    display: block;
    width: 280px; max-width: 60vw;
    animation: pasify-splash-pulse 2s ease-in-out infinite;
    user-select: none;
  }
  #app-splash .wordmark img {
    width: 100%; height: auto; display: block;
    border: 0; outline: 0;
    -webkit-user-drag: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #app-splash .dots { margin-top: 28px; display: flex; gap: 6px; }
  #app-splash .dots span {
    width: 8px; height: 8px; border-radius: 50%; background: rgba(232, 84, 42, 0.85);
    animation: pasify-splash-bounce 1.4s ease-in-out infinite both;
    display: inline-block;
  }
  #app-splash .dots span:nth-child(2) { animation-delay: 0.16s; }
  #app-splash .dots span:nth-child(3) { animation-delay: 0.32s; }
  @keyframes pasify-splash-pulse  { 0%,100% { transform: scale(1) } 50% { transform: scale(1.05) } }
  @keyframes pasify-splash-bounce { 0%,80%,100% { transform: translateY(0); opacity: 0.5 } 40% { transform: translateY(-8px); opacity: 1 } }
  #root { min-height: 100vh; background: #0a0a0a; }
</style>
<div id="app-splash">
  <div class="wordmark" aria-label="Pasify">
    <img src="/pasify-logo.png" alt="Pasify" width="280" height="120" decoding="async" fetchpriority="high" draggable="false" />
  </div>
  <div class="dots"><span></span><span></span><span></span></div>
</div>
<div id="root"></div>
<script>
  // HashRouter rescue: redirect path → hash quando WebView strippa il fragment.
  (function () {
    if (window.location.hash) return;
    var path = window.location.pathname || "";
    var search = window.location.search || "";
    if (
      path.startsWith("/calendar") ||
      path.startsWith("/p/") ||
      path.startsWith("/client-dashboard")
    ) {
      window.location.replace("/#" + path + search);
    }
  })();
</script>
<script type="module" src="/src/main.tsx"></script>
<script>
  // Rimuovi splash quando React monta.
  (function () {
    var hideSplash = function () {
      var s = document.getElementById('app-splash');
      if (!s) return;
      s.classList.add('fade-out');
      setTimeout(function () { s.parentNode && s.parentNode.removeChild(s); }, 320);
    };
    var root = document.getElementById('root');
    if (!root) return;
    var observer = new MutationObserver(function () {
      if (root.childElementCount > 0) {
        hideSplash();
        observer.disconnect();
      }
    });
    observer.observe(root, { childList: true });
    setTimeout(hideSplash, 8000);
  })();
</script>
</body>
</html>
